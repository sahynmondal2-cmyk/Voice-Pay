<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#22C55E" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Central Sound Box / Speaker Speakerphone Shape -->
  <g transform="translate(136, 126)">
    <!-- Device Body -->
    <rect x="0" y="30" width="140" height="200" rx="28" fill="#1E293B" stroke="#334155" stroke-width="6"/>
    <!-- Speaker Grill Dots -->
    <circle cx="70" cy="85" r="32" fill="#0F172A" stroke="#22C55E" stroke-width="4"/>
    <circle cx="70" cy="85" r="14" fill="#22C55E"/>
    
    <!-- Status LED Green Glow -->
    <circle cx="70" cy="155" r="8" fill="#22C55E"/>
    <circle cx="70" cy="155" r="14" fill="#22C55E" opacity="0.35"/>
    
    <!-- Sound Waves Emitted Outward to the Right -->
    <path d="M 170 80 A 60 60 0 0 1 170 180" fill="none" stroke="url(#waveGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 200 50 A 100 100 0 0 1 200 210" fill="none" stroke="url(#waveGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <path d="M 230 20 A 140 140 0 0 1 230 240" fill="none" stroke="url(#waveGrad)" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
