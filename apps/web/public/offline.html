<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayVoice - Offline Mode</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #1E293B;
      padding: 32px;
      border-radius: 16px;
      max-width: 420px;
      border: 1px solid #334155;
    }
    .badge {
      display: inline-block;
      background: #14532D;
      color: #22C55E;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      color: #FFFFFF;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    button {
      background: #22C55E;
      color: #0F172A;
      font-weight: 700;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #16A34A;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Offline Demo Fallback</div>
    <h1>You are currently offline</h1>
    <p>PayVoice demo cached data remains available locally. Reconnect to the internet for live demo updates and full feature access.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
